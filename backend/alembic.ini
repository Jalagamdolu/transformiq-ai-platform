# =============================================================================
# Alembic Configuration — TransformIQ Backend
# =============================================================================
# Run migrations from the backend/ directory:
#   alembic upgrade head      — apply all pending migrations
#   alembic revision --autogenerate -m "description"  — generate new migration
#   alembic downgrade -1      — roll back one migration
# =============================================================================

[alembic]
# Location of migration scripts (relative to this file)
script_location = alembic

# Prepend backend/ to sys.path so `app` package is importable
prepend_sys_path = .

# Template for migration file naming
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Separator for multiple version paths
version_path_separator = os

# The database URL is set programmatically in alembic/env.py
# (reads from app.core.config.settings) — leave blank here.
sqlalchemy.url =

# =============================================================================
# Logging configuration
# =============================================================================

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
